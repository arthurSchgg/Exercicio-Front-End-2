<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso contato</title>
</head>
<body>
    <section>
        <header class="cabecalho">
            <a href="/index.html"><img src="/img/wegwhite.png" alt="Cabeçalho com o logo para voltar ao inicio"></a>
            <hr>
        </header>
    </section>

    <section>
        <form action="/index.html" method="get">
            <div>
                <label for="nome">Nome:</label>
                <input required placeholder="Seu nome" type="text" name="nome" id="nome">
            </div>

            <br>

            <div>
                <label for="email">Email:</label>
                <input required placeholder="Seu email" type="email" name="email" id="email">
            </div>

            <br>

            <div>
                <label for="telefone">Telefone:</label>
                <input required placeholder="Seu telefone" type="text" name="telefone" id="telefone">
            </div>

            <br>

            <div>
                <label for="assunto">Assunto:</label>
                <input required placeholder="Seu assunto" type="text" name="assunto" id="assunto">
            </div>
            
            <br>

            <div>
                <label for="mensagem">Mensagem:</label>
                <input required placeholder="Insira sua mensagem" type="text" name="mensagem" id="mensagem">
    
            </div>
    
            <br>

            <div>
                <input type="submit" value="Enviar">
            </div>
        </form>
    </section>

    <footer>
        <hr>
        <p>Todos os direitos reservados WEG 2026 ©</p>
    </footer>
</body>
</html>
